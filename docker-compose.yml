services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data

  createbuckets:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do
        sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-wade-lake};
      "

  dagster:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/definitions.py
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      MINIO_ENDPOINT: http://minio:9000
      WADE_STORAGE_BACKEND: ${WADE_STORAGE_BACKEND:-minio}
    volumes:
      - .:/app
      - ./.dagster_home:/opt/dagster/dagster_home
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  dashboard:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: streamlit run dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - .:/app

volumes:
  minio-data:
