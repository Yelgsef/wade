services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data

  dagster:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/definitions.py
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - .:/app
      - ./.dagster_home:/opt/dagster/dagster_home
    depends_on:
      - minio

  dashboard:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: streamlit run dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  minio-data:
